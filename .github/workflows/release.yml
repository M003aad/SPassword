name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package extension
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create ZIP archive
        id: package
        shell: bash
        run: |
          mkdir -p dist
          archive="SPassword-${GITHUB_REF_NAME}.zip"
          zip -r "dist/${archive}" manifest.json popup.html popup.js style.css icons
          echo "archive=dist/${archive}" >> "$GITHUB_OUTPUT"

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: SPassword-${{ github.ref_name }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.package.outputs.archive }}" --generate-notes
